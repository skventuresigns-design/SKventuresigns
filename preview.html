<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Billboard Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      font-family: Arial, sans-serif;
    }

    .billboard-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* Base ad image fills the entire screen */
    .base-graphic {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* Live bottom overlay sitting over the empty bottom area */
    .info-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 14vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4vw 1vh 4vw;
      border-top: 2px solid rgba(255, 215, 0, 0.45);
      background: linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0));
    }

    .date-display {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 4.8vh;
      font-weight: 900;
      color: #ffd700;
      text-align: left;
      flex: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .time-display {
      font-family: "Times New Roman", Times, serif;
      font-size: 7vh;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      flex: 1;
      letter-spacing: 0.02em;
    }

    .temp-display {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 4.8vh;
      font-weight: 900;
      color: #ffd700;
      text-align: right;
      flex: 1;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="billboard-container">
    <img 
      class="base-graphic" 
      id="adImg" 
      src="https://www.skventuresigns.com/images/ad-background.png" 
      alt="Ad Creative"
    >

    <!-- Live Dynamic Overlay -->
    <div class="info-bar">
      <div class="date-display" id="dateDisplay">--</div>
      <div class="time-display" id="timeDisplay">--:-- --</div>
      <div class="temp-display" id="tempDisplay">--°F</div>
    </div>
  </div>

  <script>
    function updateDateTime() {
      const now = new Date();
      const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('dateDisplay').textContent = now.toLocaleDateString('en-US', dateOptions);

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;

      document.getElementById('timeDisplay').textContent = `${hours}:${minutes} ${ampm}`;
    }

    async function fetchWeather() {
      try {
        // Read location from URL parameter, e.g., ?location=Altamont
        const urlParams = new URLSearchParams(window.location.search);
        const locationQuery = (urlParams.get('location') || 'effingham').toLowerCase();

        // Default coordinates for Effingham, IL
        let lat = 39.1235;
        let lon = -88.5434;

        // Check if Altamont is requested
        if (locationQuery.includes('altamont')) {
          lat = 39.3564;
          lon = -88.7498;
        }

        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&temperature_unit=fahrenheit`);
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        document.getElementById('tempDisplay').textContent = `${temp}°F`;
      } catch (err) {
        document.getElementById('tempDisplay').textContent = '72°F';
      }
    }

    updateDateTime();
    setInterval(updateDateTime, 1000);

    fetchWeather();
    setInterval(fetchWeather, 600000);
  </script>

</body>
</html>
