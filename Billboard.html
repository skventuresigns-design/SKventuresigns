<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S&K Venture Signs - Billboard Engine</title>
  
  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-62F8P74L0J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-62F8P74L0J', { 'send_page_view': false });
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #billboard-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #000000;
    }

    /* Ad Viewport Area */
    #ad-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    .ad-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      pointer-events: none;
    }

    .ad-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Bottom Branding / Info Bar */
    #bottom-bar {
      height: 18%;
      min-height: 70px;
      max-height: 130px;
      background-color: #3E0100;
      border-top: 4px solid #FFC000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .bar-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    /* Branding Components */
    .brand-logo {
      font-weight: 900;
      font-size: clamp(1.2rem, 3vw, 2.4rem);
      color: #FFC000;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    .brand-phone {
      font-weight: 800;
      font-size: clamp(1.1rem, 2.8vw, 2.2rem);
      color: #FFFFFF;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .info-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .info-weather {
      font-weight: 800;
      font-size: clamp(1rem, 2.2vw, 1.8rem);
      color: #FFC000;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-datetime {
      font-weight: 700;
      font-size: clamp(0.75rem, 1.5vw, 1.1rem);
      color: #E2E8F0;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* House Ad SVG Fallback View */
    #house-ad {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #3E0100;
      color: #FFC000;
      text-align: center;
      padding: 20px;
    }

    #house-ad.visible {
      display: flex;
    }

    #house-ad h1 {
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 900;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    #house-ad p {
      font-size: clamp(1.4rem, 4vw, 3rem);
      font-weight: 800;
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <div id="billboard-container">
    <div id="ad-viewport">
      <!-- Dynamic ad images render here -->
      <div id="house-ad">
        <h1>Advertise Here</h1>
        <p>Call 844-907-4450</p>
      </div>
    </div>

    <div id="bottom-bar">
      <div id="slot-left" class="bar-slot"></div>
      <div id="slot-center" class="bar-slot"></div>
      <div id="slot-right" class="bar-slot"></div>
    </div>
  </div>

  <script>
    // TOWN COORDINATES DATABASE
    const LOCATION_COORDS = {
      'altamont': { lat: 39.0606, lon: -88.7495, name: 'Altamont' },
      'oliver': { lat: 39.490667, lon: -87.682008, name: 'Oliver' },
      'effingham': { lat: 39.1200, lon: -88.5434, name: 'Effingham' }
    };

    // Parse URL parameter (?town=xyz)
    const urlParams = new URLSearchParams(window.location.search);
    const activeTown = (urlParams.get('town') || 'altamont').trim().toLowerCase();
    const activeLocation = LOCATION_COORDS[activeTown] || LOCATION_COORDS['altamont'];

    // STATE VARIABLES
    let playlist = [];
    let currentAdIndex = -1;
    let adTimeout = null;
    let layoutRotationIndex = 0;
    let liveWeather = { temp: '--', condition: 'Loading...' };

    // ANTI-BURN-IN ROTATION PATTERNS (Cycles every 10 min)
    const ROTATION_PATTERNS = [
      ['logo', 'phone', 'info'],
      ['info', 'logo', 'phone'],
      ['phone', 'info', 'logo'],
      ['phone', 'logo', 'info'],
      ['info', 'phone', 'logo'],
      ['logo', 'info', 'phone']
    ];

    // ELEMENT CREATORS
    function getLogoElement() {
      const el = document.createElement('div');
      el.className = 'brand-logo';
      el.textContent = 'S&K Venture Signs';
      return el;
    }

    function getPhoneElement() {
      const el = document.createElement('div');
      el.className = 'brand-phone';
      el.textContent = '844-907-4450';
      return el;
    }

    function getInfoElement() {
      const el = document.createElement('div');
      el.className = 'info-stack';

      const weatherDiv = document.createElement('div');
      weatherDiv.className = 'info-weather';
      weatherDiv.id = 'bar-weather';
      weatherDiv.textContent = `${liveWeather.temp}°F ${liveWeather.condition}`;

      const dateDiv = document.createElement('div');
      dateDiv.className = 'info-datetime';
      dateDiv.id = 'bar-datetime';
      dateDiv.textContent = formatDateTime();

      el.appendChild(weatherDiv);
      el.appendChild(dateDiv);
      return el;
    }

    function formatDateTime() {
      const now = new Date();
      const options = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true };
      return now.toLocaleString('en-US', options);
    }

    function updateBottomBarLayout() {
      const pattern = ROTATION_PATTERNS[layoutRotationIndex % ROTATION_PATTERNS.length];
      const slotLeft = document.getElementById('slot-left');
      const slotCenter = document.getElementById('slot-center');
      const slotRight = document.getElementById('slot-right');

      [slotLeft, slotCenter, slotRight].forEach(slot => slot.innerHTML = '');

      const componentMap = {
        'logo': getLogoElement,
        'phone': getPhoneElement,
        'info': getInfoElement
      };

      slotLeft.appendChild(componentMap[pattern[0]]());
      slotCenter.appendChild(componentMap[pattern[1]]());
      slotRight.appendChild(componentMap[pattern[2]]());

      layoutRotationIndex++;
    }

    // WEATHER ENGINE (Open-Meteo)
    async function fetchWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${activeLocation.lat}&longitude=${activeLocation.lon}&current_weather=true&temperature_unit=fahrenheit`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const code = data.current_weather.weathercode;
          liveWeather = {
            temp: temp,
            condition: interpretWeatherCode(code)
          };
          
          const weatherEl = document.getElementById('bar-weather');
          if (weatherEl) {
            weatherEl.textContent = `${liveWeather.temp}°F ${liveWeather.condition}`;
          }
        }
      } catch (e) {
        console.warn('Weather update bypassed:', e);
      }
    }

    function interpretWeatherCode(code) {
      if (code === 0) return 'Clear';
      if (code <= 3) return 'Partly Cloudy';
      if (code <= 48) return 'Fog';
      if (code <= 67) return 'Rain';
      if (code <= 77) return 'Snow';
      if (code <= 82) return 'Showers';
      if (code <= 99) return 'Thunderstorm';
      return 'Fair';
    }

    // PLAYLIST & PRE-RENDERING ENGINE
    async function loadPlaylist() {
      try {
        const res = await fetch(`https://skventuresigns.com/playlist.json?t=${Date.now()}`);
        const data = await res.json();

        // Handle both new multi-location format and legacy single-array format
        if (data.locations && data.locations[activeTown]) {
          playlist = data.locations[activeTown];
        } else if (Array.isArray(data)) {
          playlist = data;
        } else {
          playlist = [];
        }

        renderAdSlides();
      } catch (err) {
        console.error('Playlist load error:', err);
        playlist = [];
        renderAdSlides();
      }
    }

    function renderAdSlides() {
      const viewport = document.getElementById('ad-viewport');
      const houseAd = document.getElementById('house-ad');

      // Clear existing slides (except house ad)
      const existingSlides = viewport.querySelectorAll('.ad-slide');
      existingSlides.forEach(slide => slide.remove());

      if (playlist.length === 0) {
        houseAd.classList.add('visible');
        return;
      }

      houseAd.classList.remove('visible');

      // Pre-render slides into DOM
      playlist.forEach((ad, idx) => {
        const img = document.createElement('img');
        img.src = ad.imageUrl;
        img.className = 'ad-slide';
        img.id = `slide-${idx}`;
        img.setAttribute('referrerpolicy', 'no-referrer');
        img.setAttribute('loading', 'eager');
        viewport.appendChild(img);
      });

      if (currentAdIndex === -1 || currentAdIndex >= playlist.length) {
        currentAdIndex = 0;
      }

      showNextAd();
    }

    function showNextAd() {
      if (playlist.length === 0) return;

      const totalAds = playlist.length;
      const prevIndex = (currentAdIndex - 1 + totalAds) % totalAds;
      const currentIndex = currentAdIndex;

      const prevSlide = document.getElementById(`slide-${prevIndex}`);
      const currentSlide = document.getElementById(`slide-${currentIndex}`);

      if (prevSlide) prevSlide.classList.remove('active');
      if (currentSlide) currentSlide.classList.add('active');

      const adData = playlist[currentIndex];

      // Send GA4 Proof-of-Play
      if (typeof gtag === 'function') {
        gtag('event', 'billboard_ad_play', {
          'advertiser': adData.advertiser || 'Unknown',
          'location': activeTown,
          'duration': adData.duration || 8
        });
      }

      // Schedule next ad
      const durationMs = (adData.duration || 8) * 1000;
      currentAdIndex = (currentAdIndex + 1) % totalAds;

      clearTimeout(adTimeout);
      adTimeout = setTimeout(showNextAd, durationMs);
    }

    // CLOCK TICK (Every second)
    setInterval(() => {
      const dateEl = document.getElementById('bar-datetime');
      if (dateEl) {
        dateEl.textContent = formatDateTime();
      }
    }, 1000);

    // PERIODIC CYCLES
    setInterval(updateBottomBarLayout, 600000); // Anti-burn-in swap every 10 min
    setInterval(fetchWeather, 600000);          // Weather check every 10 min
    setInterval(loadPlaylist, 300000);          // Auto-sync playlist every 5 min

    // 30-MINUTE SILENT MEMORY FLUSH (Clears WebView leak on NovaStar Android)
    setTimeout(() => {
      window.location.reload(true);
    }, 1800000);

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      updateBottomBarLayout();
      fetchWeather();
      loadPlaylist();
    });
  </script>
</body>
</html>
