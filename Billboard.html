<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&K Venture Signs Display Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #displayContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #000000;
        }

        /* Primary Slide Viewport */
        #adViewport {
            position: relative;
            width: 100vw;
            height: calc(100vh - 80px); /* Default indoor TV height factoring bottom banner */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000000;
        }

        #adImageDisplay {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Bottom Branding & Weather Bar */
        #bottomBanner {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 80px;
            background-color: #fcf6de;
            border-top: 3px solid #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .banner-brand {
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        .banner-phone {
            font-size: 1.3rem;
            font-weight: 700;
            color: #b91c1c;
        }

        .banner-right {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .banner-widget {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        /* Full Bleed Mode (Roadside LED & Trailer Mode) */
        body.no-banner #bottomBanner {
            display: none !important;
        }

        body.no-banner #adViewport {
            height: 100vh !important;
            width: 100vw !important;
        }

        body.no-banner #adImageDisplay {
            object-fit: fill; /* Maps edge-to-edge for custom LED matrix cabinets */
        }
    </style>
</head>
<body>

    <div id="displayContainer">
        <!-- Main Slide Presentation -->
        <main id="adViewport">
            <img id="adImageDisplay" src="" alt="Signage Content">
        </main>

        <!-- Dynamic Indoor Banner -->
        <footer id="bottomBanner">
            <div class="banner-left">
                <span class="banner-brand">S&K VENTURE SIGNS</span>
                <span class="banner-phone">844-907-4450</span>
            </div>
            <div class="banner-right">
                <div id="weatherWidget" class="banner-widget">Loading Weather...</div>
                <div id="clockWidget" class="banner-widget">--:-- --</div>
            </div>
        </footer>
    </div>

    <script>
        // 1. URL Parameter Parsing
        const urlParams = new URLSearchParams(window.location.search);
        const townParam = urlParams.get('town') || 'All';
        const noBannerParam = urlParams.get('nobanner');

        // Apply full-bleed layout if nobanner=true or location requires it
        if (noBannerParam === 'true' || urlParams.has('nobanner')) {
            document.body.classList.add('no-banner');
        }

        // 2. State & Rotation Engine
        let playlist = [];
        let currentIndex = 0;
        let rotationTimer = null;
        let loadTimeout = null;

        // Fetch live playlist.json generated from Google Apps Script
        async function fetchPlaylist() {
            try {
                const response = await fetch('playlist.json?nocache=' + new Date().getTime());
                if (!response.ok) throw new Error("Network response error");
                const data = await response.json();

                // Filter by location if specified
                let filteredData = data;
                if (townParam.toLowerCase() !== 'all') {
                    filteredData = data.filter(item => {
                        return item.town && item.town.toLowerCase() === townParam.toLowerCase();
                    });
                }

                if (filteredData.length > 0) {
                    playlist = filteredData;
                } else if (data.length > 0) {
                    playlist = data; // Fallback to all ads if town parameter has zero records
                }
            } catch (err) {
                console.warn("Error loading playlist.json, maintaining current cache:", err);
            }
        }

        // 3. Preload & SSL Failsafe Slide Transition
        function displayNextSlide() {
            if (playlist.length === 0) {
                setTimeout(displayNextSlide, 2000);
                return;
            }

            if (currentIndex >= playlist.length) {
                currentIndex = 0;
            }

            const currentItem = playlist[currentIndex];
            const nextAdUrl = currentItem.imageUrl || currentItem.url;
            const duration = (parseInt(currentItem.duration, 10) || 10) * 1000;

            const currentDisplayElement = document.getElementById("adImageDisplay");
            let hasHandledTransition = false;

            const testImg = new Image();

            // Success Handshake: Image loaded and SSL verified
            testImg.onload = function() {
                if (hasHandledTransition) return;
                hasHandledTransition = true;
                clearTimeout(loadTimeout);

                currentDisplayElement.src = testImg.src;

                // Move index pointer forward
                currentIndex++;

                // Schedule next transition
                rotationTimer = setTimeout(displayNextSlide, duration);
            };

            // Failsafe: SSL mismatch, 404, or invalid image headers
            testImg.onerror = function() {
                if (hasHandledTransition) return;
                hasHandledTransition = true;
                clearTimeout(loadTimeout);

                console.warn("Asset failed SSL or loading check. Advancing:", nextAdUrl);
                currentIndex++;
                displayNextSlide();
            };

            // Network Timeout Failsafe: If host hangs or drops without reporting error
            loadTimeout = setTimeout(() => {
                if (!hasHandledTransition) {
                    hasHandledTransition = true;
                    testImg.src = ""; // Abort request
                    console.warn("Asset network timeout. Advancing:", nextAdUrl);
                    currentIndex++;
                    displayNextSlide();
                }
            }, 2500);

            // Trigger request
            testImg.src = nextAdUrl;
        }

        // 4. Banner Clock & Weather
        function startClock() {
            const clockEl = document.getElementById('clockWidget');
            function updateClock() {
                const now = new Date();
                clockEl.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        async function updateWeather() {
            const weatherEl = document.getElementById('weatherWidget');
            try {
                // Open-Meteo API (Latitude/Longitude centered near Effingham / South-Central IL)
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=39.12&longitude=-88.54&current_weather=true&temperature_unit=fahrenheit');
                const data = await res.json();
                if (data && data.current_weather) {
                    const temp = Math.round(data.current_weather.temperature);
                    weatherEl.innerText = `${temp}°F`;
                }
            } catch (e) {
                weatherEl.innerText = "Fair";
            }
        }

        // 5. Initialize Application
        async function init() {
            if (!document.body.classList.contains('no-banner')) {
                startClock();
                updateWeather();
                setInterval(updateWeather, 15 * 60 * 1000); // 15-minute weather refresh
            }

            await fetchPlaylist();
            displayNextSlide();

            // Check for playlist updates every 5 minutes
            setInterval(fetchPlaylist, 5 * 60 * 1000);
        }

        window.onload = init;
    </script>
</body>
</html>
