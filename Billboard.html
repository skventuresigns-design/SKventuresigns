<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&K Venture Signs - Billboard Engine</title>

    <!-- Google Analytics: Proof of Play -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-62F8P74L0J"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-62F8P74L0J', { 
            'page_type': 'billboard_novastar_v1',
            'debug_mode': true 
        });
    </script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Arial Black', Impact, sans-serif;
        }

        #billboard-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000000;
        }

        #ad-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 100px);
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 1;
        }

        .slide {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
        }

        .slide.fading {
            opacity: 0;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: fill;
        }

        #brand-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: #3E0100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 10;
            color: #FAC429;
            box-sizing: border-box;
        }

        .bar-section {
            flex: 1;
            display: flex;
            align-items: center;
            height: 100%;
        }

        .sec-logo {
            order: 1;
            justify-content: flex-start;
        }

        .sec-phone {
            order: 2;
            justify-content: center;
            color: #ffffff;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            -webkit-text-stroke: 1.5px #000000;
        }

        .sec-info {
            order: 3;
            justify-content: flex-end;
            gap: 25px;
            color: #ffffff;
        }

        .brand-logo-img {
            height: 140%;
            max-height: none;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }

        #temp-display {
            font-size: 55px;
            font-weight: 900;
            line-height: 1;
            -webkit-text-stroke: 1.5px #000000;
            color: #FAC429;
        }

        #time-display {
            font-size: 55px;
            font-weight: 900;
            line-height: 1;
            font-family: 'Courier New', monospace;
            border-left: 3px solid rgba(255, 255, 255, 0.3);
            padding-left: 25px;
            -webkit-text-stroke: 1.5px #000000;
        }
    </style>
</head>
<body>

    <div id="billboard-container">
        <div id="ad-stage">
            <div id="active-slide" class="slide">
                <img id="active-image" src="" alt="Billboard Display" />
            </div>
        </div>

        <div id="brand-bar">
            <div class="bar-section sec-logo" id="logo-slot">
                <img src="https://raw.githack.com/Werewolf3788/SKVentureSigns/main/images/S%26K%20Name.png" 
                     alt="S&K Venture Signs" 
                     class="brand-logo-img" 
                     onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
                <div id="logo-fallback" style="display:none; font-size:32px; font-weight:900;">S & K VENTURE SIGNS</div>
            </div>

            <div class="bar-section sec-phone" id="phone-slot">
                844-907-4450
            </div>

            <div class="bar-section sec-info">
                <div id="temp-display">--°</div>
                <div id="time-display">00:00</div>
            </div>
        </div>
    </div>

    <script>
    (function() {
        var DISPLAY_INTERVAL = 12000;
        
        var adSlots = [];
        var currentIndex = -1;
        var currentQuarter = null;

        function logProofOfPlay(slotName, slotIndex) {
            try {
                if (typeof gtag === 'function') {
                    gtag('event', 'billboard_ad_play', {
                        ad_name: slotName,
                        slot_index: slotIndex
                    });
                }
            } catch(e) {}
        }

        function rotateAd() {
            if (!adSlots || adSlots.length === 0) return;

            currentIndex = (currentIndex + 1) % adSlots.length;
            var slot = adSlots[currentIndex];

            var slide = document.getElementById('active-slide');
            var img = document.getElementById('active-image');

            if (!slide || !img) return;

            slide.className = 'slide fading';
            
            setTimeout(function() {
                img.referrerPolicy = "no-referrer";
                img.src = slot.imageUrl;
                slide.className = 'slide';
                logProofOfPlay(slot.name, slot.slotNumber);
            }, 300);
        }

        function fetchSheetData() {
            var xhr = new XMLHttpRequest();
            var url = "https://skventuresigns.com/playlist.json?t=" + new Date().getTime();
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        var loaded = [];

                        if (data && data.length) {
                            for (var i = 0; i < data.length; i++) {
                                var item = data[i];
                                var name = item.ad_name || item.Name || item.name || ('Ad ' + (i + 1));
                                
                                var directUrl = item.image_url || item.ImageUrl || item.directUrl || item.URL || '';
                                if (!directUrl) {
                                    for (var key in item) {
                                        if (item.hasOwnProperty(key) && typeof item[key] === 'string' && item[key].indexOf('http') === 0) {
                                            directUrl = item[key];
                                            break;
                                        }
                                    }
                                }

                                if (directUrl && directUrl.indexOf('http') === 0) {
                                    loaded.push({
                                        slotNumber: i + 1,
                                        name: String(name).trim(),
                                        imageUrl: String(directUrl).trim()
                                    });
                                }
                            }
                        }

                        if (loaded.length > 0) {
                            adSlots = loaded;
                            if (currentIndex === -1) {
                                rotateAd();
                            }
                        }
                    } catch(e) {
                        console.error('Error parsing playlist JSON:', e);
                    }
                }
            };
            xhr.send();
        }

        function fetchWeather() {
            var xhr = new XMLHttpRequest();
            var url = "https://api.open-meteo.com/v1/forecast?latitude=39.1243&longitude=-88.5525&current=temperature_2m&temperature_unit=fahrenheit";
            xhr.open("GET", url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data && data.current) {
                            var temp = Math.round(data.current.temperature_2m);
                            var tempEl = document.getElementById('temp-display');
                            if (tempEl) {
                                tempEl.innerText = temp + "°";
                                if (temp <= 32) tempEl.style.color = "#00f2ff";
                                else if (temp <= 50) tempEl.style.color = "#0ea5e9";
                                else if (temp <= 75) tempEl.style.color = "#FAC429";
                                else if (temp <= 90) tempEl.style.color = "#f97316";
                                else tempEl.style.color = "#ef4444";
                            }
                        }
                    } catch(e) {}
                }
            };
            xhr.send();
        }

        function updateClock() {
            var now = new Date();
            var timeEl = document.getElementById('time-display');
            if (timeEl) {
                timeEl.innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            }

            var min = now.getMinutes();
            var q = Math.floor(min / 15);

            if (currentQuarter !== q) {
                currentQuarter = q;
                var logoSlot = document.getElementById('logo-slot');
                var phoneSlot = document.getElementById('phone-slot');
                if (logoSlot && phoneSlot) {
                    if (q % 2 === 0) {
                        logoSlot.style.order = '1';
                        logoSlot.style.justifyContent = 'flex-start';
                        phoneSlot.style.order = '2';
                        phoneSlot.style.justifyContent = 'center';
                    } else {
                        phoneSlot.style.order = '1';
                        phoneSlot.style.justifyContent = 'flex-start';
                        logoSlot.style.order = '2';
                        logoSlot.style.justifyContent = 'center';
                    }
                }
            }
        }

        function init() {
            fetchSheetData();
            fetchWeather();
            updateClock();

            setInterval(updateClock, 1000);
            setInterval(rotateAd, DISPLAY_INTERVAL);
            setInterval(fetchWeather, 600000);
            setInterval(fetchSheetData, 60000);
        }

        if (document.readyState === "complete" || document.readyState === "interactive") {
            init();
        } else {
            document.addEventListener("DOMContentLoaded", init);
        }
    })();
    </script>
</body>
</html>
