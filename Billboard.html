<script>
(function() {
    var displayInterval = 12000;
    var currentAdIndex = 0;
    var adSlideElements = [];
    var currentAdQueue = [];
    var pendingAdQueue = null;
    var currentTenMinTracker = null;

    // Location & Programmatic Configuration
    var activeLocation = {
        name: "Flora",
        lat: 38.668700,
        lon: -88.485300,
        phone: "844-907-4450",
        screen_id: "ca0e14ae-b80e-45f8-bb68-5375d9e02bbd",
        venue_id: "34tyu3",
        vast_tag: "", 
        blip_tag: "https://app.blipbillboards.com/api/v1/signs/ca0e14ae-b80e-45f8-bb68-5375d9e02bbd/ad"
    };

    function logProofOfPlay(adItem, slotIndex) {
        try {
            if (typeof gtag === 'function' && adItem) {
                var providerType = 'direct_local';
                if (adItem.isProgrammatic) {
                    providerType = (adItem.provider === 'blip') ? 'blip_programmatic' : 'vistar_programmatic';
                } else if (adItem.type === 'house') {
                    providerType = 'house_fallback';
                }

                gtag('event', 'billboard_ad_play', {
                    ad_name: adItem.name || 'Ad',
                    slot_index: slotIndex,
                    ad_provider: providerType,
                    media_type: adItem.type || 'image',
                    screen_location: activeLocation.name
                });
            }
        } catch(e) {}
    }

    function fireImpressionBeacons(impressions) {
        if (!impressions || !Array.isArray(impressions)) return;
        impressions.forEach(function(url) {
            if (url) {
                var beacon = new Image();
                beacon.src = url;
            }
        });
    }

    function renderSlides(startIndex) {
        var viewport = document.getElementById('sk-ad-viewport');
        if (!viewport || currentAdQueue.length === 0) return;
        
        viewport.innerHTML = '';
        adSlideElements = [];
        currentAdIndex = (typeof startIndex === 'number' && startIndex < currentAdQueue.length) ? startIndex : 0;

        for (var idx = 0; idx < currentAdQueue.length; idx++) {
            var item = currentAdQueue[idx];
            var slide = document.createElement('div');
            slide.className = 'sk-ad-slide' + (idx === currentAdIndex ? ' active' : '');

            if (item.type === 'video') {
                var video = document.createElement('video');
                video.src = item.url;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                video.setAttribute('referrerpolicy', 'no-referrer');
                slide.appendChild(video);
            } else if (item.type === 'house') {
                var house = document.createElement('div');
                house.className = 'sk-house-slide';
                house.innerHTML = '<h1>' + item.headline + '</h1><p>' + item.subhead + '</p>';
                slide.appendChild(house);
            } else {
                var image = document.createElement('img');
                image.setAttribute('referrerpolicy', 'no-referrer');
                image.src = item.url;
                
                (function(s, im) {
                    im.onerror = function() {
                        s.style.display = 'none';
                        var sIndex = adSlideElements.indexOf(s);
                        if (sIndex > -1) adSlideElements.splice(sIndex, 1);
                        if (adSlideElements.length > 0 && s.classList.contains('active')) {
                            if (currentAdIndex >= adSlideElements.length) currentAdIndex = 0;
                            if (adSlideElements[currentAdIndex]) adSlideElements[currentAdIndex].classList.add('active');
                        }
                    };
                })(slide, image);

                slide.appendChild(image);
            }

            viewport.appendChild(slide);
            adSlideElements.push(slide);
        }

        var activeMedia = currentAdQueue[currentAdIndex];
        if (activeMedia) {
            if (activeMedia.isProgrammatic && activeMedia.impressions) {
                fireImpressionBeacons(activeMedia.impressions);
            }
            logProofOfPlay(activeMedia, currentAdIndex + 1);

            var vid = adSlideElements[currentAdIndex] ? adSlideElements[currentAdIndex].querySelector('video') : null;
            if (vid) {
                vid.currentTime = 0;
                vid.play().catch(function(){});
            }
        }
    }

    function rotateAds() {
        if (adSlideElements.length === 0) return;

        if (currentAdIndex >= adSlideElements.length - 1 && pendingAdQueue) {
            currentAdQueue = pendingAdQueue;
            pendingAdQueue = null;
            renderSlides(0);
            return;
        }

        if (adSlideElements[currentAdIndex]) {
            adSlideElements[currentAdIndex].classList.remove('active');
        }

        currentAdIndex = (currentAdIndex + 1) % adSlideElements.length;

        if (adSlideElements[currentAdIndex]) {
            adSlideElements[currentAdIndex].classList.add('active');
        }

        var activeMedia = currentAdQueue[currentAdIndex];
        if (activeMedia) {
            if (activeMedia.isProgrammatic && activeMedia.impressions) {
                fireImpressionBeacons(activeMedia.impressions);
            }
            logProofOfPlay(activeMedia, currentAdIndex + 1);

            var vid = adSlideElements[currentAdIndex] ? adSlideElements[currentAdIndex].querySelector('video') : null;
            if (vid) {
                vid.currentTime = 0;
                vid.play().catch(function(){});
            }
        }
    }

    function fetchPlaylistData() {
        var xhr = new XMLHttpRequest();
        var url = "https://skventuresigns.com/playlist.json?t=" + new Date().getTime();
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    var freshQueue = [];

                    if (data && data.length) {
                        for (var i = 0; i < data.length; i++) {
                            var item = data[i];
                            var name = item.ad_name || item.Name || item.name || ('Ad ' + (i + 1));
                            var directUrl = item.image_url || item.ImageUrl || item.directUrl || item.URL || '';
                            
                            if (!directUrl) {
                                for (var key in item) {
                                    if (item.hasOwnProperty(key) && typeof item[key] === 'string' && item[key].indexOf('http') === 0) {
                                        directUrl = item[key];
                                        break;
                                    }
                                }
                            }

                            if (directUrl && directUrl.indexOf('http') === 0) {
                                var isVid = directUrl.match(/\.(mp4|webm|ogg)$/i);
                                freshQueue.push({
                                    type: isVid ? 'video' : 'image',
                                    url: String(directUrl).trim(),
                                    name: String(name).trim(),
                                    isProgrammatic: false
                                });
                            }
                        }
                    }

                    if (freshQueue.length === 0) {
                        freshQueue.push({
                            type: 'house',
                            headline: "ADVERTISE HERE",
                            subhead: "CALL " + activeLocation.phone,
                            name: "S&K House Ad",
                            isProgrammatic: false
                        });
                    }

                    if (currentAdQueue.length === 0) {
                        currentAdQueue = freshQueue;
                        renderSlides(0);
                    } else if (JSON.stringify(freshQueue) !== JSON.stringify(currentAdQueue)) {
                        pendingAdQueue = freshQueue;
                    }

                    fetchProgrammaticAds();
                } catch(e) {
                    console.error('Error parsing playlist JSON:', e);
                }
            }
        };
        xhr.send();
    }

    // Programmatic Ad Handler (Blip & Vistar)
    function buildProgrammaticUrl(endpointUrl) {
        if (!endpointUrl) return null;
        var ts = new Date().getTime();
        return endpointUrl
            .replace(/\[SCREEN_ID\]/g, encodeURIComponent(activeLocation.screen_id))
            .replace(/\[VENUE_ID\]/g, encodeURIComponent(activeLocation.venue_id))
            .replace(/\[TIMESTAMP\]/g, ts)
            .replace(/\[CACHEBUSTER\]/g, ts)
            .replace(/\[LAT\]/g, activeLocation.lat)
            .replace(/\[LON\]/g, activeLocation.lon)
            .replace(/\[WIDTH\]/g, window.innerWidth || 1920)
            .replace(/\[HEIGHT\]/g, (window.innerHeight - 100) || 1080);
    }

    async function fetchProgrammaticAds() {
        // 1. Fetch Blip
        if (activeLocation.blip_tag) {
            try {
                var blipUrl = buildProgrammaticUrl(activeLocation.blip_tag);
                if (blipUrl.indexOf("corsproxy.io") === -1) {
                    blipUrl = "https://corsproxy.io/?" + encodeURIComponent(blipUrl);
                }
                var ctrl = new AbortController();
                var tid = setTimeout(function() { ctrl.abort(); }, 3500);

                var res = await fetch(blipUrl, { cache: "no-store", signal: ctrl.signal });
                clearTimeout(tid);
                var data = await res.json();

                if (data && (data.image_url || data.media_url || data.url)) {
                    var mediaUrl = data.image_url || data.media_url || data.url;
                    var isVid = mediaUrl.match(/\.(mp4|webm)$/i);
                    var blipItem = {
                        type: isVid ? 'video' : 'image',
                        url: mediaUrl,
                        name: "Blip Programmatic Ad",
                        isProgrammatic: true,
                        provider: 'blip',
                        impressions: data.impression_urls || (data.impression_url ? [data.impression_url] : [])
                    };

                    if (!currentAdQueue.some(function(item) { return item.url === blipItem.url; })) {
                        if (pendingAdQueue) pendingAdQueue.push(blipItem);
                        else pendingAdQueue = currentAdQueue.concat([blipItem]);
                    }
                }
            } catch(e) {}
        }

        // 2. Fetch Vistar
        if (activeLocation.vast_tag) {
            try {
                var vistarUrl = buildProgrammaticUrl(activeLocation.vast_tag);
                var ctrl2 = new AbortController();
                var tid2 = setTimeout(function() { ctrl2.abort(); }, 3500);

                var res2 = await fetch(vistarUrl, { cache: "no-store", signal: ctrl2.signal });
                clearTimeout(tid2);
                var xmlText = await res2.text();

                var parser = new DOMParser();
                var xmlDoc = parser.parseFromString(xmlText, "text/xml");
                var impressionTags = xmlDoc.getElementsByTagName("Impression");
                var trackingUrls = [];
                for (var i = 0; i < impressionTags.length; i++) {
                    if (impressionTags[i].textContent) trackingUrls.push(impressionTags[i].textContent.trim());
                }

                var mediaFile = xmlDoc.getElementsByTagName("MediaFile")[0];
                var staticResource = xmlDoc.getElementsByTagName("StaticResource")[0];
                var vistarItem = null;

                if (mediaFile && mediaFile.textContent) {
                    vistarItem = { type: 'video', url: mediaFile.textContent.trim(), name: "Vistar Video Ad", isProgrammatic: true, provider: 'vistar', impressions: trackingUrls };
                } else if (staticResource && staticResource.textContent) {
                    vistarItem = { type: 'image', url: staticResource.textContent.trim(), name: "Vistar Static Ad", isProgrammatic: true, provider: 'vistar', impressions: trackingUrls };
                }

                if (vistarItem && !currentAdQueue.some(function(item) { return item.url === vistarItem.url; })) {
                    if (pendingAdQueue) pendingAdQueue.push(vistarItem);
                    else pendingAdQueue = currentAdQueue.concat([vistarItem]);
                }
            } catch(e) {}
        }
    }

    function fetchWeather() {
        var xhr = new XMLHttpRequest();
        var url = "https://api.open-meteo.com/v1/forecast?latitude=" + activeLocation.lat + "&longitude=" + activeLocation.lon + "&current=temperature_2m&temperature_unit=fahrenheit";
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data && data.current) {
                        var temp = Math.round(data.current.temperature_2m);
                        var tempDisplay = document.getElementById('sk-temp-val');
                        if (tempDisplay) {
                            tempDisplay.innerText = temp + "°";
                            if (temp <= 32) tempDisplay.style.color = "#00f2ff";
                            else if (temp <= 50) tempDisplay.style.color = "#0ea5e9";
                            else if (temp <= 75) tempDisplay.style.color = "#FAC429";
                            else if (temp <= 90) tempDisplay.style.color = "#f97316";
                            else tempDisplay.style.color = "#ef4444";
                        }
                    }
                } catch(e) {}
            }
        };
        xhr.send();
    }

    function updateTenMinSwap(tenMinBlock) {
        var logoGroup = document.querySelector('.sk-logo-group');
        var phoneDiv = document.querySelector('.sk-bottom-phone');
        var infoStack = document.querySelector('.sk-info-stack');
        
        if (!logoGroup || !phoneDiv || !infoStack) return;

        logoGroup.style.opacity = '0';
        phoneDiv.style.opacity = '0';
        infoStack.style.opacity = '0';
        
        setTimeout(function() {
            var layouts = [
                { logo: 1, phone: 2, info: 3 },
                { logo: 2, phone: 3, info: 1 },
                { logo: 3, phone: 1, info: 2 },
                { logo: 3, phone: 2, info: 1 },
                { logo: 2, phone: 1, info: 3 },
                { logo: 1, phone: 3, info: 2 }
            ];
            
            var currentLayout = layouts[tenMinBlock % 6];
            
            function applyLayout(el, order) {
                el.style.order = order;
                if (order === 1) el.style.justifyContent = 'flex-start';
                else if (order === 2) el.style.justifyContent = 'center';
                else if (order === 3) el.style.justifyContent = 'flex-end';
            }

            applyLayout(logoGroup, currentLayout.logo);
            applyLayout(phoneDiv, currentLayout.phone);
            applyLayout(infoStack, currentLayout.info);

            logoGroup.style.opacity = '1';
            phoneDiv.style.opacity = '1';
            infoStack.style.opacity = '1';
        }, 500);
    }

    function updateLocalTime() {
        var now = new Date();
        var timeEl = document.getElementById('sk-time-val');
        var dateEl = document.getElementById('sk-date-val');
        
        if (timeEl) {
            timeEl.innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit', hour12: true });
        }
        
        if (dateEl) {
            dateEl.innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        var min = now.getMinutes();
        var currentTenMin = Math.floor(min / 10);

        if (currentTenMinTracker !== currentTenMin) {
            var isInitialLoad = (currentTenMinTracker === null);
            currentTenMinTracker = currentTenMin;
            
            if (isInitialLoad) {
                var logoGroup = document.querySelector('.sk-logo-group');
                var phoneDiv = document.querySelector('.sk-bottom-phone');
                var infoStack = document.querySelector('.sk-info-stack');
                
                if (logoGroup && phoneDiv && infoStack) {
                    var layouts = [
                        { logo: 1, phone: 2, info: 3 },
                        { logo: 2, phone: 3, info: 1 },
                        { logo: 3, phone: 1, info: 2 },
                        { logo: 3, phone: 2, info: 1 },
                        { logo: 2, phone: 1, info: 3 },
                        { logo: 1, phone: 3, info: 2 }
                    ];
                    var currentLayout = layouts[currentTenMin % 6];
                    
                    function applyLayout(el, order) {
                        el.style.order = order;
                        if (order === 1) el.style.justifyContent = 'flex-start';
                        else if (order === 2) el.style.justifyContent = 'center';
                        else if (order === 3) el.style.justifyContent = 'flex-end';
                    }
                    applyLayout(logoGroup, currentLayout.logo);
                    applyLayout(phoneDiv, currentLayout.phone);
                    applyLayout(infoStack, currentLayout.info);
                }
            } else {
                updateTenMinSwap(currentTenMin);
            }
        }
    }

    function initBillboard() {
        fetchPlaylistData();
        fetchWeather();
        updateLocalTime();

        setInterval(updateLocalTime, 1000);
        setInterval(rotateAds, displayInterval);
        setInterval(fetchWeather, 600000);
        setInterval(fetchPlaylistData, 60000);
        
        // 30-minute memory refresh
        setInterval(function() {
            window.location.reload();
        }, 1800000);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
        initBillboard();
    } else {
        document.addEventListener("DOMContentLoaded", initBillboard);
    }
})();
</script>
</body>
