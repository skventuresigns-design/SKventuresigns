<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Billboard Engine</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-62F8P74L0J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-62F8P74L0J', {
      'page_type': 'billboard_kiosk_engine',
      'traffic_type': 'internal'
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    #billboard-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000;
    }
    .slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }
    .slide img,
    .slide video,
    .slide object {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      border: none;
    }
    .slide object {
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div id="billboard-container">
    <div id="slide-container"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const activeTown = (urlParams.get('town') || 'xenia').toLowerCase();
    const hasNoBanner = urlParams.get('nobanner') === 'true';
    const displayInterval = hasNoBanner ? 12000 : 10000;

    let slides = [];
    let currentSlideIndex = 0;
    let rotationTimer = null;
    let playlistData = [];

    function isLocationOpen() {
      return true;
    }

    function logAdImpression(adItem) {
      if (typeof gtag !== 'function' || !adItem) return;
      if (!isLocationOpen()) return;

      gtag('event', 'billboard_ad_play', {
        'event_category': 'Digital Billboard Impressions',
        'advertiser': adItem.advertiser || adItem.name || 'Direct Ad',
        'location': activeTown,
        'duration': Math.round(displayInterval / 1000)
      });
    }

    function detectMediaType(url) {
      const cleanUrl = (url || '').split('?')[0].trim().toLowerCase();
      if (cleanUrl.match(/\.(mp4|webm|ogg|mov)$/)) return 'video';
      if (cleanUrl.match(/\.(html|htm)$/)) return 'html';
      return 'image';
    }

    function createMediaElement(item) {
      const url = (item.imageUrl || item.url || '').trim();
      const mediaType = detectMediaType(url);

      if (mediaType === 'video') {
        const video = document.createElement('video');
        video.src = url;
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        return video;
      }

      if (mediaType === 'html') {
        const obj = document.createElement('object');
        obj.data = url;
        obj.type = 'text/html';
        return obj;
      }

      const img = document.createElement('img');
      img.src = url;
      img.alt = item.advertiser || item.name || 'Ad Slide';
      return img;
    }

    function renderSlides(items) {
      const container = document.getElementById('slide-container');
      container.innerHTML = '';
      slides = [];
      playlistData = items;

      if (!items || items.length === 0) return;

      items.forEach((item, index) => {
        const slideDiv = document.createElement('div');
        slideDiv.className = `slide ${index === 0 ? 'active' : ''}`;

        const mediaEl = createMediaElement(item);
        slideDiv.appendChild(mediaEl);

        container.appendChild(slideDiv);
        slides.push(slideDiv);
      });

      if (items.length > 0) {
        logAdImpression(items[0]);
        startRotation();
      }
    }

    function applySlideSwitch() {
      if (slides.length <= 1) return;

      slides[currentSlideIndex].classList.remove('active');
      currentSlideIndex = (currentSlideIndex + 1) % slides.length;
      slides[currentSlideIndex].classList.add('active');

      const activeMedia = slides[currentSlideIndex].querySelector('video');
      if (activeMedia) {
        activeMedia.currentTime = 0;
        activeMedia.play().catch(() => {});
      }

      logAdImpression(playlistData[currentSlideIndex]);
    }

    function startRotation() {
      if (rotationTimer) clearInterval(rotationTimer);
      rotationTimer = setInterval(applySlideSwitch, displayInterval);
    }

    async function loadPlaylist() {
      try {
        const res = await fetch('./playlist.json?nocache=' + Date.now());
        const data = await res.json();
        const townList = data[activeTown] || data['default'] || [];
        renderSlides(townList);
      } catch (err) {
        console.error('Error fetching playlist:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadPlaylist);
  </script>
</body>
</html>
