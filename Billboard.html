<!DOCTYPE html>

    <title>S&K Venture Signs Billboard - Kiosk Engine</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>">

    <!-- Fonts & Icons -->
    <script src="//unpkg.com/lucide@latest"></script>

    <!-- Google Tag Manager & S&K Ventures GA4 Tracking -->

    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-62F8P74L0J', {

<body oncontextmenu="return false;">

<div id="sk-billboard-root-container" class="light-mode" onmousemove="handleInteraction()" ontouchstart="handleInteraction()">

    <div id="landscape-lock">
        <div class="lock-content">
            <i data-lucide="rotate-cw" style="width: 64px; height: 64px; margin-bottom: 16px;"></i>
            <p style="font-size: 20px; font-weight: bold; margin: 0;">Landscape Orientation Required</p>
        </div>
    </div>

    <a href="./index.html" id="ghost-back-btn">
        <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
        <span>Back to Site</span>
    </a>

    <button id="fullscreen-toggle-btn" onclick="toggleFullScreen()">
        <i data-lucide="maximize" id="fs-icon" style="width: 20px; height: 20px;"></i>
        <span>Full Screen</span>
    </button>

    <div id="sk-billboard-display">
        
        <div id="sk-ad-viewport"></div>

        <!-- BOTTOM STATUS BAR -->
        <div id="sk-bottom-bar">
            
            <div class="sk-logo-group">
                <div class="sk-logo">
                    <img src="//raw.githack.com/Werewolf3788/SKVentureSigns/main/images/S%26K%20Name.png" 
                         alt="" 
                         data-alt-text="S&K Venture Signs Official Logo"
                         class="sk-brand-img"
                         onerror="this.style.display='none'; document.getElementById('sk-fallback-text').style.display='block';">

                </div>
            </div>
            
            <div class="sk-bottom-phone" id="sk-phone-display">844-907-4450</div>
            
            <div class="sk-info-stack">
                <div class="sk-weather">
                    <div id="sk-temp-val">--°</div>
                </div>
                <div class="sk-time-date-group">
                    <div id="sk-date-val">--</div>
                    <div id="sk-time-val">00:00</div>

            </div>

        <div class="sk-led-overlay"></div>

<script>
(function() {
    const displayInterval = 12000;
    const memoryRefreshCycle = 1800000;

    const LOCATION_COORDS = {
        'oliver': { name: 'Oliver', lat: 39.490667, lon: -87.682008 },
        'altamont': { name: 'Altamont', lat: 39.0606, lon: -88.7495 },
        'claycity': { name: 'Clay City', lat: 38.6889, lon: -88.3556 },
        'xenia': { name: 'Xenia', lat: 38.6387, lon: -88.6417 },
        'brownstown': { name: 'Brownstown', lat: 38.9953, lon: -88.9531 },
        'desoto': { name: 'DeSoto', lat: 37.8184, lon: -89.2273 },
        'floratv': { name: 'Flora TV', lat: 38.6687, lon: -88.4853 }
    };

    function getTownFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get('town');
        return raw ? raw.toLowerCase().replace(/[^a-z0-9]/g, '') : 'oliver';
    }

    const activeTown = getTownFromUrl();
    const activeLocation = LOCATION_COORDS[activeTown] || LOCATION_COORDS['oliver'];

    let currentAdIndex = 0;
    let adSlideElements = [];
    let currentAdQueue = [];
    let targetTimeZone = "America/Chicago";
    let isNightTimeSolar = null;
    let interactionTimer = null;
    let currentTenMinTracker = null;

    function logAdImpression(adItem) {
        if (typeof gtag !== 'function' || !adItem) return;
        gtag('event', 'billboard_ad_play', {
            'event_category': 'Digital Billboard Impressions',
            'advertiser': adItem.name || 'Direct Ad',
            'location': activeTown,
            'duration': 12
        });
    }

    window.handleInteraction = function() {
        const backBtn = document.getElementById('ghost-back-btn');
        const fsBtn = document.getElementById('fullscreen-toggle-btn');
        if (backBtn) backBtn.classList.add('active');
        if (fsBtn) fsBtn.classList.add('active');
        
        clearTimeout(interactionTimer);
        interactionTimer = setTimeout(() => { 
            if (backBtn) backBtn.classList.remove('active'); 
            if (fsBtn) fsBtn.classList.remove('active'); 
        }, 3000);
    };

    window.toggleFullScreen = function() {
        const root = document.documentElement;
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) { 
            if (root.requestFullscreen) root.requestFullscreen();
            else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
            else if (root.msRequestFullscreen) root.msRequestFullscreen();
        } else { 
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
        }
    };

    function syncTimeTheme() {
        const root = document.getElementById('sk-billboard-root-container');
        if (!root) return;
        let isNightTime = (isNightTimeSolar !== null) ? isNightTimeSolar : (new Date().getHours() < 6 || new Date().getHours() >= 19);
        if (isNightTime) {
            root.classList.add('dark-mode');
            root.classList.remove('light-mode');
        } else {
            root.classList.add('light-mode');
            root.classList.remove('dark-mode');
        }
    }

    async function loadPlaylist() {
        try {
            const res = await fetch(`https://skventuresigns.com/playlist.json?t=${Date.now()}`);
            if (!res.ok) throw new Error("HTTP error");
            const data = await res.json();

            let freshQueue = [];

            if (data.locations && Array.isArray(data.locations[activeTown])) {
                freshQueue = data.locations[activeTown];
            } else if (data.locations && typeof data.locations === 'object') {
                const availableKey = Object.keys(data.locations).find(k => k.replace(/[^a-z0-9]/g, '') === activeTown);
                if (availableKey) freshQueue = data.locations[availableKey];
            } else if (Array.isArray(data)) {
                freshQueue = data;
            }

            // Get local date string YYYY-MM-DD for comparison
            let todayStr = "";
            try {
                const nowTz = new Date(new Date().toLocaleString("en-US", { timeZone: targetTimeZone }));
                const y = nowTz.getFullYear();
                const m = String(nowTz.getMonth() + 1).padStart(2, '0');
                const d = String(nowTz.getDate()).padStart(2, '0');
                todayStr = `${y}-${m}-${d}`;
            } catch (e) {
                const now = new Date();
                todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            }

            currentAdQueue = freshQueue.filter(item => {
                // If no expiration date is set, keep the ad active indefinitely
                if (!item.expirationDate || item.expirationDate.toString().trim() === '') return true;

                let exp = item.expirationDate.toString().trim();
                if (exp.includes('/')) {
                    const parts = exp.split('/');
                    if (parts.length === 3) {
                        const m = parts[0].padStart(2, '0');
                        const d = parts[1].padStart(2, '0');
                        const y = parts[2].length === 2 ? `20${parts[2]}` : parts[2];
                        exp = `${y}-${m}-${d}`;
                    }
                }
                
                // Keep ad if today is on or before the expiration date (runs through 11:59:59 PM)
                return exp >= todayStr;
            }).map(item => {
                const cleanUrl = item.imageUrl || item.url || item.image || '';
                const isVid = cleanUrl.match(/\.(mp4|webm|ogg)$/i);
                return {
                    url: cleanUrl,
                    type: isVid ? 'video' : 'image',
                    name: item.advertiser || item.name || 'Direct Local Ad'
                };
            }).filter(item => item.url !== '');

            if (currentAdQueue.length === 0) {
                currentAdQueue.push({
                    type: 'house',
                    headline: "ADVERTISE HERE",
                    subhead: "CALL 844-907-4450",
                    name: "S&K House Ad"
                });
            }

            renderSlides(0);
        } catch (e) {
            console.warn("Playlist load error:", e);
        }
    }

    function renderSlides(startIndex = 0) {
        const viewport = document.getElementById('sk-ad-viewport');
        if (!viewport || currentAdQueue.length === 0) return;
        
        viewport.innerHTML = '';
        adSlideElements = [];
        currentAdIndex = (startIndex < currentAdQueue.length) ? startIndex : 0;

        currentAdQueue.forEach((item, idx) => {
            const slide = document.createElement('div');
            slide.className = `sk-ad-slide ${idx === currentAdIndex ? 'active' : ''}`;

            if (item.type === 'video') {
                const video = document.createElement('video');
                video.src = item.url;
                video.autoplay = true;
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.setAttribute('referrerpolicy', 'no-referrer');
                slide.appendChild(video);
            } else if (item.type === 'house') {
                const house = document.createElement('div');
                house.className = 'sk-house-slide';
                house.innerHTML = `<h1>${item.headline}</h1><p>${item.subhead}</p>`;
                slide.appendChild(house);
            } else {
                const image = document.createElement('img');
                image.src = item.url;
                image.setAttribute('referrerpolicy', 'no-referrer');
                image.setAttribute('loading', 'eager');
                slide.appendChild(image);
            }

            viewport.appendChild(slide);
            adSlideElements.push(slide);
        });

        const activeItem = currentAdQueue[currentAdIndex];
        if (activeItem) {
            logAdImpression(activeItem);
            const activeVid = adSlideElements[currentAdIndex] ? adSlideElements[currentAdIndex].querySelector('video') : null;
            if (activeVid) {
                activeVid.currentTime = 0;
                activeVid.play().catch(()=>{});
            }
        }
    }

    function rotateAds() {
        if (adSlideElements.length === 0) return;

        if (adSlideElements[currentAdIndex]) {
            adSlideElements[currentAdIndex].classList.remove('active');
        }

        currentAdIndex = (currentAdIndex + 1) % adSlideElements.length;

        if (adSlideElements[currentAdIndex]) {
            adSlideElements[currentAdIndex].classList.add('active');
        }

        const activeItem = currentAdQueue[currentAdIndex];
        if (activeItem) {
            logAdImpression(activeItem);
            const activeVid = adSlideElements[currentAdIndex] ? adSlideElements[currentAdIndex].querySelector('video') : null;
            if (activeVid) {
                activeVid.currentTime = 0;
                activeVid.play().catch(()=>{});
            }
        }
    }

    async function fetchWeather() {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${activeLocation.lat}&longitude=${activeLocation.lon}&current=temperature_2m,apparent_temperature,is_day&temperature_unit=fahrenheit&timezone=auto`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.timezone) targetTimeZone = data.timezone;
            if (data.current && data.current.is_day !== undefined) isNightTimeSolar = (data.current.is_day === 0);
            
            const tempVal = Math.round(data.current.temperature_2m);
            updateWeatherUI(tempVal);
            syncTimeTheme();
        } catch(e) {}
    }

    function updateWeatherUI(temp) {
        const tempDisplay = document.getElementById('sk-temp-val');
        if (tempDisplay) {
            tempDisplay.innerText = `${temp}°`;
            let tempColor = "#ffffff";
            if (temp <= 32) tempColor = "#00f2ff"; 
            else if (temp <= 50) tempColor = "#0ea5e9"; 
            else if (temp <= 75) tempColor = "#FAC429"; 
            else if (temp <= 90) tempColor = "#f97316"; 
            else tempColor = "#ef4444"; 
            tempDisplay.style.color = tempColor;
        }
    }

    function updateTenMinSwap(tenMinBlock) {
        const logoGroup = document.querySelector('.sk-logo-group');
        const phoneDiv = document.querySelector('.sk-bottom-phone');
        const infoStack = document.querySelector('.sk-info-stack');
        
        if (!logoGroup || !phoneDiv || !infoStack) return;

        logoGroup.style.opacity = '0';
        phoneDiv.style.opacity = '0';
        infoStack.style.opacity = '0';
        
        setTimeout(() => {
            const layouts = [
                { logo: 1, phone: 2, info: 3 },
                { logo: 2, phone: 3, info: 1 },
                { logo: 3, phone: 1, info: 2 },
                { logo: 3, phone: 2, info: 1 },
                { logo: 2, phone: 1, info: 3 },
                { logo: 1, phone: 3, info: 2 }
            ];
            
            const currentLayout = layouts[tenMinBlock % 6];
            
            function applyLayout(el, order) {
                el.style.order = order;
                if (order === 1) el.style.justifyContent = 'flex-start';
                else if (order === 2) el.style.justifyContent = 'center';
                else if (order === 3) el.style.justifyContent = 'flex-end';
            }

            applyLayout(logoGroup, currentLayout.logo);
            applyLayout(phoneDiv, currentLayout.phone);
            applyLayout(infoStack, currentLayout.info);

            logoGroup.style.opacity = '1';
            phoneDiv.style.opacity = '1';
            infoStack.style.opacity = '1';
        }, 500);
    }

    function updateLocalTime() {
        const timeEl = document.getElementById('sk-time-val');
        const dateEl = document.getElementById('sk-date-val');
        if (!timeEl) return;
        
        let currentMin = new Date().getMinutes();

        try {
            const timeString = new Date().toLocaleTimeString('en-US', { timeZone: targetTimeZone, hour: '2-digit', minute:'2-digit', hour12: true });
            timeEl.innerText = timeString;

            if (dateEl) {
                const dateString = new Date().toLocaleDateString('en-US', { timeZone: targetTimeZone, weekday: 'short', month: 'short', day: 'numeric' });
                dateEl.innerText = dateString;
            }
            
            const tzDate = new Date(new Date().toLocaleString('en-US', { timeZone: targetTimeZone }));
            currentMin = tzDate.getMinutes();
        } catch (e) {
            timeEl.innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true});
            if (dateEl) {
                dateEl.innerText = new Date().toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
            }
        }

        let currentTenMin = Math.floor(currentMin / 10);

        if (currentTenMinTracker !== currentTenMin) {
            const isInitialLoad = (currentTenMinTracker === null);
            currentTenMinTracker = currentTenMin;
            
            if (isInitialLoad) {
                const logoGroup = document.querySelector('.sk-logo-group');
                const phoneDiv = document.querySelector('.sk-bottom-phone');
                const infoStack = document.querySelector('.sk-info-stack');
                
                if (logoGroup && phoneDiv && infoStack) {
                    const layouts = [
                        { logo: 1, phone: 2, info: 3 },
                        { logo: 2, phone: 3, info: 1 },
                        { logo: 3, phone: 1, info: 2 },
                        { logo: 3, phone: 2, info: 1 },
                        { logo: 2, phone: 1, info: 3 },
                        { logo: 1, phone: 3, info: 2 } 
                    ];
                    const currentLayout = layouts[currentTenMin % 6];
                    
                    function applyLayout(el, order) {
                        el.style.order = order;
                        if (order === 1) el.style.justifyContent = 'flex-start';
                        else if (order === 2) el.style.justifyContent = 'center';
                        else if (order === 3) el.style.justifyContent = 'flex-end';
                    }
                    applyLayout(logoGroup, currentLayout.logo);
                    applyLayout(phoneDiv, currentLayout.phone);
                    applyLayout(infoStack, currentLayout.info);
                }
            } else {
                updateTenMinSwap(currentTenMin);
            }
        }
    }

    function initBillboard() {
        if (typeof lucide !== 'undefined') lucide.createIcons();
        syncTimeTheme();
        fetchWeather();
        loadPlaylist();

        updateLocalTime();
        setInterval(updateLocalTime, 1000);
        setInterval(rotateAds, displayInterval);
        setInterval(fetchWeather, 600000);
        setInterval(loadPlaylist, 300000);
        setInterval(syncTimeTheme, 300000);

        setInterval(() => {
            window.location.reload();
        }, memoryRefreshCycle);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
        initBillboard();
    } else {
        document.addEventListener("DOMContentLoaded", initBillboard);
    }
})();
</script>
</body>
</html>
