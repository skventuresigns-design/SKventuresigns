<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>S&K Venture Signs - Billboard Engine</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@600;700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-62F8P74L0J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-62F8P74L0J', { 'send_page_view': false });
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #billboard-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #000000;
    }

    /* Ad Viewport Area */
    #ad-viewport {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    .ad-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      pointer-events: none;
    }

    .ad-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Bottom Branding / Info Bar */
    #bottom-bar {
      height: 18%;
      min-height: 75px;
      max-height: 130px;
      background: linear-gradient(180deg, #3E0100 0%, #200000 100%);
      border-top: 4px solid #FFC000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 100;
    }

    .bar-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    /* Branding Components */
    .brand-logo {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 3.2vw, 2.6rem);
      color: #FFC000;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .brand-phone {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(1.3rem, 3vw, 2.4rem);
      color: #FFFFFF;
      letter-spacing: 1.5px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .info-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.2;
    }

    .info-weather {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: clamp(1.1rem, 2.4vw, 2rem);
      color: #FFC000;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .info-datetime {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: clamp(0.75rem, 1.4vw, 1.15rem);
      color: #F8FAFC;
      margin-top: 2px;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    /* House Ad SVG Fallback View */
    #house-ad {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #3E0100 0%, #1A0000 100%);
      color: #FFC000;
      text-align: center;
      padding: 20px;
    }

    #house-ad.visible {
      display: flex;
    }

    #house-ad h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.2rem, 6.5vw, 5.5rem);
      font-weight: 900;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }

    #house-ad p {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.5rem, 4.2vw, 3.2rem);
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 2px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div id="billboard-container">
    <div id="ad-viewport">
      <div id="house-ad">
        <h1>Advertise Here</h1>
        <p>Call 844-907-4450</p>
      </div>
    </div>

    <div id="bottom-bar">
      <div id="slot-left" class="bar-slot"></div>
      <div id="slot-center" class="bar-slot"></div>
      <div id="slot-right" class="bar-slot"></div>
    </div>
  </div>

  <script>
    // LOCATION COORDINATES DATABASE
    const LOCATION_COORDS = {
      'altamont': { lat: 39.0606, lon: -88.7495, name: 'Altamont' },
      'oliver': { lat: 39.490667, lon: -87.682008, name: 'Oliver' },
      'effingham': { lat: 39.1200, lon: -88.5434, name: 'Effingham' }
    };

    // Parse URL parameter (?town=xyz)
    const urlParams = new URLSearchParams(window.location.search);
    const rawTown = urlParams.get('town');
    const activeTown = rawTown ? rawTown.trim().toLowerCase() : 'oliver';
    const activeLocation = LOCATION_COORDS[activeTown] || LOCATION_COORDS['oliver'];

    // STATE VARIABLES
    let playlist = [];
    let currentAdIndex = 0;
    let adTimer = null;
    let layoutRotationIndex = 0;
    let liveWeather = { temp: '--', condition: 'Updating...' };

    // ANTI-BURN-IN ROTATION PATTERNS
    const ROTATION_PATTERNS = [
      ['logo', 'phone', 'info'],
      ['info', 'logo', 'phone'],
      ['phone', 'info', 'logo'],
      ['phone', 'logo', 'info'],
      ['info', 'phone', 'logo'],
      ['logo', 'info', 'phone']
    ];

    function getLogoElement() {
      const el = document.createElement('div');
      el.className = 'brand-logo';
      el.textContent = 'S&K Venture Signs';
      return el;
    }

    function getPhoneElement() {
      const el = document.createElement('div');
      el.className = 'brand-phone';
      el.textContent = '844-907-4450';
      return el;
    }

    function getInfoElement() {
      const el = document.createElement('div');
      el.className = 'info-stack';

      const weatherDiv = document.createElement('div');
      weatherDiv.className = 'info-weather';
      weatherDiv.id = 'bar-weather';
      weatherDiv.textContent = `${liveWeather.temp}°F ${liveWeather.condition}`;

      const dateDiv = document.createElement('div');
      dateDiv.className = 'info-datetime';
      dateDiv.id = 'bar-datetime';
      dateDiv.textContent = formatDateTime();

      el.appendChild(weatherDiv);
      el.appendChild(dateDiv);
      return el;
    }

    function formatDateTime() {
      const now = new Date();
      const options = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true };
      return now.toLocaleString('en-US', options);
    }

    function updateBottomBarLayout() {
      const pattern = ROTATION_PATTERNS[layoutRotationIndex % ROTATION_PATTERNS.length];
      const slotLeft = document.getElementById('slot-left');
      const slotCenter = document.getElementById('slot-center');
      const slotRight = document.getElementById('slot-right');

      [slotLeft, slotCenter, slotRight].forEach(slot => {
        if (slot) slot.innerHTML = '';
      });

      const componentMap = {
        'logo': getLogoElement,
        'phone': getPhoneElement,
        'info': getInfoElement
      };

      if (slotLeft) slotLeft.appendChild(componentMap[pattern[0]]());
      if (slotCenter) slotCenter.appendChild(componentMap[pattern[1]]());
      if (slotRight) slotRight.appendChild(componentMap[pattern[2]]());

      layoutRotationIndex++;
    }

    // WEATHER ENGINE (Open-Meteo)
    async function fetchWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${activeLocation.lat}&longitude=${activeLocation.lon}&current_weather=true&temperature_unit=fahrenheit`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data.current_weather) {
          const temp = Math.round(data.current_weather.temperature);
          const code = data.current_weather.weathercode;
          liveWeather = {
            temp: temp,
            condition: interpretWeatherCode(code)
          };
          
          const weatherEl = document.getElementById('bar-weather');
          if (weatherEl) {
            weatherEl.textContent = `${liveWeather.temp}°F ${liveWeather.condition}`;
          }
        }
      } catch (e) {
        console.warn('Weather fetch bypassed:', e);
      }
    }

    function interpretWeatherCode(code) {
      if (code === 0) return 'Clear';
      if (code <= 3) return 'Partly Cloudy';
      if (code <= 48) return 'Fog';
      if (code <= 67) return 'Rain';
      if (code <= 77) return 'Snow';
      if (code <= 82) return 'Showers';
      if (code <= 99) return 'Storms';
      return 'Fair';
    }

    // PLAYLIST ENGINE - ADAPTS TO BOTH FORMATS
    async function loadPlaylist() {
      try {
        const res = await fetch(`https://skventuresigns.com/playlist.json?t=${Date.now()}`);
        if (!res.ok) throw new Error('Network error loading playlist');
        
        const rawData = await res.json();

        // 1. Array format (Current GitHub state)
        if (Array.isArray(rawData)) {
          playlist = rawData;
        }
        // 2. Nested locations object format: { locations: { oliver: [...] } }
        else if (rawData && rawData.locations && Array.isArray(rawData.locations[activeTown])) {
          playlist = rawData.locations[activeTown];
        } 
        // 3. Fallback to any town array found
        else if (rawData && rawData.locations && typeof rawData.locations === 'object') {
          const firstKey = Object.keys(rawData.locations)[0];
          playlist = rawData.locations[firstKey] || [];
        }
        // 4. Direct key format: { oliver: [...] }
        else if (rawData && Array.isArray(rawData[activeTown])) {
          playlist = rawData[activeTown];
        } else {
          playlist = [];
        }

        buildSlides();
      } catch (err) {
        console.warn('Playlist fetch error:', err);
        if (playlist.length === 0) {
          buildSlides();
        }
      }
    }

    function buildSlides() {
      const viewport = document.getElementById('ad-viewport');
      const houseAd = document.getElementById('house-ad');

      // Clear existing slides
      const existing = viewport.querySelectorAll('.ad-slide');
      existing.forEach(el => el.remove());

      if (!playlist || playlist.length === 0) {
        if (houseAd) houseAd.classList.add('visible');
        clearTimeout(adTimer);
        return;
      }

      if (houseAd) houseAd.classList.remove('visible');

      // Build DOM slides
      playlist.forEach((ad, index) => {
        const img = document.createElement('img');
        img.src = ad.imageUrl || ad.image || ad.url || '';
        img.className = 'ad-slide';
        img.id = `ad-slide-${index}`;
        img.setAttribute('referrerpolicy', 'no-referrer');
        img.setAttribute('loading', 'eager');
        viewport.appendChild(img);
      });

      currentAdIndex = 0;
      runSlideshow();
    }

    function runSlideshow() {
      clearTimeout(adTimer);

      if (!playlist || playlist.length === 0) {
        const houseAd = document.getElementById('house-ad');
        if (houseAd) houseAd.classList.add('visible');
        return;
      }

      const total = playlist.length;
      if (currentAdIndex >= total) currentAdIndex = 0;

      // Swap slide opacity
      for (let i = 0; i < total; i++) {
        const slide = document.getElementById(`ad-slide-${i}`);
        if (slide) {
          if (i === currentAdIndex) {
            slide.classList.add('active');
          } else {
            slide.classList.remove('active');
          }
        }
      }

      const currentAd = playlist[currentAdIndex];

      // GA4 Analytics Tracking
      if (typeof gtag === 'function' && currentAd) {
        gtag('event', 'billboard_ad_play', {
          'advertiser': currentAd.advertiser || 'Unknown',
          'location': activeTown,
          'duration': currentAd.duration || 8
        });
      }

      const durationMs = ((currentAd && currentAd.duration) ? Number(currentAd.duration) : 8) * 1000;

      currentAdIndex = (currentAdIndex + 1) % total;
      adTimer = setTimeout(runSlideshow, durationMs);
    }

    // CLOCK TICK
    setInterval(() => {
      const dateEl = document.getElementById('bar-datetime');
      if (dateEl) {
        dateEl.textContent = formatDateTime();
      }
    }, 1000);

    // BACKGROUND REFRESH TIMERS
    setInterval(updateBottomBarLayout, 600000); // 10 min anti-burn-in
    setInterval(fetchWeather, 600000);          // 10 min weather
    setInterval(loadPlaylist, 300000);          // 5 min playlist sync

    // 30-MIN SILENT MEMORY FLUSH
    setTimeout(() => {
      window.location.reload(true);
    }, 1800000);

    // INITIAL LOAD
    window.addEventListener('DOMContentLoaded', () => {
      updateBottomBarLayout();
      fetchWeather();
      loadPlaylist();
    });
  </script>
</body>
</html>
