<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S&K Venture Signs Billboard - Engine</title>

    <!-- Google Analytics: Proof of Play -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-62F8P74L0J"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-62F8P74L0J', { 
            'page_type': 'billboard_novastar_v1',
            'debug_mode': true 
        });
    </script>

    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background: #000000 !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            touch-action: none !important;
            overscroll-behavior: none !important;
            cursor: none !important;
        }

        #sk-billboard-root-container {
            --bb-bottom-bg: #3E0100;
            --bb-text: #ffffff; 
            --bb-border: rgba(255, 255, 255, 0.2);
            --bar-height: clamp(70px, 11vh, 130px);
            --sk-yellow: #FAC429;
            
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            inset: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #000000 !important;
            font-family: 'Arial Black', Gadget, sans-serif !important;
            box-sizing: border-box !important;
            overflow: hidden !important;
            z-index: 1 !important;
        }

        #sk-billboard-display {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: #000000 !important;
            display: flex !important;
            flex-direction: column !important;
            overflow: hidden !important;
        }

        #sk-ad-viewport {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - var(--bar-height)) !important; 
            z-index: 1 !important;
            background: #000000 !important;
            overflow: hidden !important;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }

        .sk-ad-slide {
            display: none !important;
            width: 100% !important;
            height: 100% !important;
            justify-content: center !important;
            align-items: center !important;
            background: #000000 !important;
            position: absolute;
            inset: 0;
        }

        .sk-ad-slide.active { 
            display: flex !important; 
        }

        .sk-ad-slide img, .sk-ad-slide video {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important; 
        }

        .sk-house-slide {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #3E0100 0%, #150000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            padding: 40px;
            box-sizing: border-box;
        }

        .sk-house-slide h1 {
            font-size: clamp(32px, 5vw, 90px);
            color: var(--sk-yellow);
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            -webkit-text-stroke: 2px black;
        }

        .sk-house-slide p {
            font-size: clamp(20px, 3vw, 55px);
            margin: 0;
            font-weight: 900;
            letter-spacing: 3px;
        }

        #sk-bottom-bar {
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: var(--bar-height) !important;
            background: var(--bb-bottom-bg) !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 0 clamp(15px, 2.5vw, 50px) !important;
            gap: clamp(10px, 2vw, 30px) !important;
            z-index: 10 !important;
            flex-wrap: nowrap !important;
            white-space: nowrap !important;
            box-sizing: border-box !important;
        }

        .sk-logo-group, .sk-bottom-phone, .sk-info-stack {
            flex: 1 1 auto !important;
            min-width: 0 !important;
            height: 100% !important;
            display: flex !important;
            align-items: center !important;
            transition: opacity 0.5s ease-in-out !important;
        }

        .sk-logo-group { order: 1; justify-content: flex-start; }

        .sk-logo {
            height: 100% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            color: var(--sk-yellow) !important;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5) !important;
        }

        .sk-brand-img {
            height: 150%;
            max-height: none !important;
            max-width: 100% !important;
            width: auto !important;
            object-fit: contain !important;
            display: block !important;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5)) !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        #sk-fallback-text {
            font-family: 'Arial Black', Gadget, sans-serif !important;
            font-weight: 900 !important;
            font-size: clamp(16px, 2vw, 42px) !important;
        }

        .sk-bottom-phone {
            order: 2;
            justify-content: center; 
            color: var(--bb-text) !important;
            font-weight: 900 !important;
            font-size: clamp(20px, 2.4vw, 52px) !important;
            letter-spacing: 4px !important; 
            -webkit-text-stroke: 1.5px black !important;
        }

        .sk-info-stack {
            order: 3;
            justify-content: flex-end; 
            gap: clamp(10px, 1.8vw, 35px) !important;
            color: var(--bb-text) !important;
        }

        .sk-weather { 
            display: flex !important; 
            flex-direction: column !important; 
            align-items: center !important; 
            justify-content: center !important; 
        }

        #sk-temp-val { 
            font-size: clamp(24px, 3.8vw, 80px) !important; 
            font-weight: 900 !important; 
            line-height: 1 !important; 
            color: var(--sk-yellow);
            -webkit-text-stroke: 1.5px black !important;
        }

        #sk-time-val {
            font-size: clamp(24px, 3.8vw, 80px) !important; 
            font-weight: 900 !important; 
            line-height: 1 !important; 
            font-family: 'Courier New', monospace !important;
            border-left: 4px solid var(--bb-border) !important;
            padding-left: clamp(10px, 1.8vw, 35px) !important;
            -webkit-text-stroke: 1.5px black !important;
        }

        .sk-led-overlay {
            position: absolute !important;
            inset: 0 !important;
            background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px) !important;
            background-size: 4px 4px !important;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.3) !important;
            pointer-events: none !important;
            z-index: 5 !important;
        }
    </style>
</head>
<body>

<div id="sk-billboard-root-container">
    <div id="sk-billboard-display">
        
        <div id="sk-ad-viewport"></div>

        <div id="sk-bottom-bar">
            
            <div class="sk-logo-group">
                <div class="sk-logo">
                    <img src="https://raw.githack.com/Werewolf3788/SKVentureSigns/main/images/S%26K%20Name.png" 
                         alt="S&K Venture Signs" 
                         class="sk-brand-img"
                         onerror="this.style.display='none'; document.getElementById('sk-fallback-text').style.display='block';">
                    <div id="sk-fallback-text" style="display:none;">S & K VENTURE SIGNS</div>
                </div>
            </div>
            
            <div class="sk-bottom-phone" id="sk-phone-display">844-907-4450</div>
            
            <div class="sk-info-stack">
                <div class="sk-weather">
                    <div id="sk-temp-val">--°</div>
                </div>
                <div id="sk-time-val">00:00</div>
            </div>
        </div>

        <div class="sk-led-overlay"></div>
    </div>
</div>

<script>
(function() {
    var displayInterval = 12000;
    var currentAdIndex = 0;
    var adSlideElements = [];
    var currentAdQueue = [];
    var currentTenMinTracker = null;

    function logProofOfPlay(slotName, slotIndex) {
        try {
            if (typeof gtag === 'function') {
                gtag('event', 'billboard_ad_play', {
                    ad_name: slotName,
                    slot_index: slotIndex
                });
            }
        } catch(e) {}
    }

    function renderSlides(startIndex) {
        var viewport = document.getElementById('sk-ad-viewport');
        if (!viewport || currentAdQueue.length === 0) return;
        
        viewport.innerHTML = '';
        adSlideElements = [];
        currentAdIndex = (typeof startIndex === 'number' && startIndex < currentAdQueue.length) ? startIndex : 0;

        for (var idx = 0; idx < currentAdQueue.length; idx++) {
            var item = currentAdQueue[idx];
            var slide = document.createElement('div');
            slide.className = 'sk-ad-slide' + (idx === currentAdIndex ? ' active' : '');

            if (item.type === 'house') {
                var house = document.createElement('div');
                house.className = 'sk-house-slide';
                house.innerHTML = '<h1>' + item.headline + '</h1><p>' + item.subhead + '</p>';
                slide.appendChild(house);
            } else {
                var image = document.createElement('img');
                image.setAttribute('referrerpolicy', 'no-referrer');
                image.src = item.url;
                
                (function(s, im) {
                    im.onerror = function() {
                        s.style.display = 'none';
                        var sIndex = adSlideElements.indexOf(s);
                        if (sIndex > -1) adSlideElements.splice(sIndex, 1);
                        if (adSlideElements.length > 0 && s.classList.contains('active')) {
                            if (currentAdIndex >= adSlideElements.length) currentAdIndex = 0;
                            if (adSlideElements[currentAdIndex]) adSlideElements[currentAdIndex].classList.add('active');
                        }
                    };
                })(slide, image);

                slide.appendChild(image);
            }

            viewport.appendChild(slide);
            adSlideElements.push(slide);
        }

        var activeMedia = currentAdQueue[currentAdIndex];
        if (activeMedia) {
            logProofOfPlay(activeMedia.name, currentAdIndex + 1);
        }
    }

    function rotateAds() {
        if (adSlideElements.length === 0) return;

        if (adSlideElements[currentAdIndex]) {
            adSlideElements[currentAdIndex].classList.remove('active');
        }

        currentAdIndex = (currentAdIndex + 1) % adSlideElements.length;

        if (adSlideElements[currentAdIndex]) {
            adSlideElements[currentAdIndex].classList.add('active');
        }

        var activeMedia = currentAdQueue[currentAdIndex];
        if (activeMedia) {
            logProofOfPlay(activeMedia.name, currentAdIndex + 1);
        }
    }

    function fetchPlaylistData() {
        var xhr = new XMLHttpRequest();
        var url = "https://skventuresigns.com/playlist.json?t=" + new Date().getTime();
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    var freshQueue = [];

                    if (data && data.length) {
                        for (var i = 0; i < data.length; i++) {
                            var item = data[i];
                            var name = item.ad_name || item.Name || item.name || ('Ad ' + (i + 1));
                            var directUrl = item.image_url || item.ImageUrl || item.directUrl || item.URL || '';
                            
                            if (!directUrl) {
                                for (var key in item) {
                                    if (item.hasOwnProperty(key) && typeof item[key] === 'string' && item[key].indexOf('http') === 0) {
                                        directUrl = item[key];
                                        break;
                                    }
                                }
                            }

                            if (directUrl && directUrl.indexOf('http') === 0) {
                                freshQueue.push({
                                    type: 'image',
                                    url: String(directUrl).trim(),
                                    name: String(name).trim()
                                });
                            }
                        }
                    }

                    if (freshQueue.length === 0) {
                        freshQueue.push({
                            type: 'house',
                            headline: "ADVERTISE HERE",
                            subhead: "CALL 844-907-4450",
                            name: "S&K House Ad"
                        });
                    }

                    if (JSON.stringify(freshQueue) !== JSON.stringify(currentAdQueue)) {
                        currentAdQueue = freshQueue;
                        renderSlides(currentAdIndex);
                    }
                } catch(e) {
                    console.error('Error parsing playlist JSON:', e);
                }
            }
        };
        xhr.send();
    }

    function fetchWeather() {
        var xhr = new XMLHttpRequest();
        var url = "https://api.open-meteo.com/v1/forecast?latitude=38.6687&longitude=-88.4853&current=temperature_2m&temperature_unit=fahrenheit";
        xhr.open("GET", url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && xhr.status === 200) {
                try {
                    var data = JSON.parse(xhr.responseText);
                    if (data && data.current) {
                        var temp = Math.round(data.current.temperature_2m);
                        var tempDisplay = document.getElementById('sk-temp-val');
                        if (tempDisplay) {
                            tempDisplay.innerText = temp + "°";
                            if (temp <= 32) tempDisplay.style.color = "#00f2ff";
                            else if (temp <= 50) tempDisplay.style.color = "#0ea5e9";
                            else if (temp <= 75) tempDisplay.style.color = "#FAC429";
                            else if (temp <= 90) tempDisplay.style.color = "#f97316";
                            else tempDisplay.style.color = "#ef4444";
                        }
                    }
                } catch(e) {}
            }
        };
        xhr.send();
    }

    function updateTenMinSwap(tenMinBlock) {
        var logoGroup = document.querySelector('.sk-logo-group');
        var phoneDiv = document.querySelector('.sk-bottom-phone');
        var infoStack = document.querySelector('.sk-info-stack');
        
        if (!logoGroup || !phoneDiv || !infoStack) return;

        logoGroup.style.opacity = '0';
        phoneDiv.style.opacity = '0';
        infoStack.style.opacity = '0';
        
        setTimeout(function() {
            var layouts = [
                { logo: 1, phone: 2, info: 3 },
                { logo: 2, phone: 3, info: 1 },
                { logo: 3, phone: 1, info: 2 },
                { logo: 3, phone: 2, info: 1 },
                { logo: 2, phone: 1, info: 3 },
                { logo: 1, phone: 3, info: 2 }
            ];
            
            var currentLayout = layouts[tenMinBlock % 6];
            
            function applyLayout(el, order) {
                el.style.order = order;
                if (order === 1) el.style.justifyContent = 'flex-start';
                else if (order === 2) el.style.justifyContent = 'center';
                else if (order === 3) el.style.justifyContent = 'flex-end';
            }

            applyLayout(logoGroup, currentLayout.logo);
            applyLayout(phoneDiv, currentLayout.phone);
            applyLayout(infoStack, currentLayout.info);

            logoGroup.style.opacity = '1';
            phoneDiv.style.opacity = '1';
            infoStack.style.opacity = '1';
        }, 500);
    }

    function updateLocalTime() {
        var now = new Date();
        var timeEl = document.getElementById('sk-time-val');
        if (timeEl) {
            timeEl.innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute:'2-digit', hour12: true });
        }

        var min = now.getMinutes();
        var currentTenMin = Math.floor(min / 10);

        if (currentTenMinTracker !== currentTenMin) {
            var isInitialLoad = (currentTenMinTracker === null);
            currentTenMinTracker = currentTenMin;
            
            if (isInitialLoad) {
                var logoGroup = document.querySelector('.sk-logo-group');
                var phoneDiv = document.querySelector('.sk-bottom-phone');
                var infoStack = document.querySelector('.sk-info-stack');
                
                if (logoGroup && phoneDiv && infoStack) {
                    var layouts = [
                        { logo: 1, phone: 2, info: 3 },
                        { logo: 2, phone: 3, info: 1 },
                        { logo: 3, phone: 1, info: 2 },
                        { logo: 3, phone: 2, info: 1 },
                        { logo: 2, phone: 1, info: 3 },
                        { logo: 1, phone: 3, info: 2 }
                    ];
                    var currentLayout = layouts[currentTenMin % 6];
                    
                    function applyLayout(el, order) {
                        el.style.order = order;
                        if (order === 1) el.style.justifyContent = 'flex-start';
                        else if (order === 2) el.style.justifyContent = 'center';
                        else if (order === 3) el.style.justifyContent = 'flex-end';
                    }
                    applyLayout(logoGroup, currentLayout.logo);
                    applyLayout(phoneDiv, currentLayout.phone);
                    applyLayout(infoStack, currentLayout.info);
                }
            } else {
                updateTenMinSwap(currentTenMin);
            }
        }
    }

    function initBillboard() {
        fetchPlaylistData();
        fetchWeather();
        updateLocalTime();

        setInterval(updateLocalTime, 1000);
        setInterval(rotateAds, displayInterval);
        setInterval(fetchWeather, 600000);
        setInterval(fetchPlaylistData, 60000);
        
        // 30-minute memory refresh
        setInterval(function() {
            window.location.reload();
        }, 1800000);
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
        initBillboard();
    } else {
        document.addEventListener("DOMContentLoaded", initBillboard);
    }
})();
</script>
</body>
</html>
